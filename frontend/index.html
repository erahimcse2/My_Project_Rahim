<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
            background: #f4f6f9;
        }

        h1, h2 {
            color: #243447;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #00000010;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 9px 13px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 3px;
        }

        .primary {
            background: #1769aa;
            color: white;
        }

        .edit {
            background: #f0ad4e;
            color: #222;
        }

        .delete {
            background: #d9534f;
            color: white;
        }

        .cancel {
            background: #777;
            color: white;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #1769aa;
            color: white;
        }

        #message {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <h1>Student Management System</h1>

    <section class="card">
        <h2 id="formTitle">Add New Student</h2>

        <form id="studentForm">
            <input type="hidden" id="studentId">

            <div class="form-grid">
                <input
                    type="text"
                    id="first_name"
                    placeholder="Student first Name"
                    maxlength="100"
                    required
                >

                <input
                    type="text"
                    id="last_name"
                    placeholder="Student last Name"
                    maxlength="100"
                    required
                >

                <input
                    type="text"
                    id="department"
                    placeholder="Department (e.g. CSE)"
                    maxlength="100"
                    required
                >

                <input
                    type="text"
                    id="roll"
                    placeholder="Roll"
                    maxlength="100"
                    required
                >

                <input
                    type="number"
                    id="session"
                    placeholder="Session"
                    min="1"
                    step="1"
                    required
                >
            </div>

            <br>

            <button type="submit" id="submitBtn" class="primary">
                Add Student
            </button>

            <button
                type="button"
                id="cancelBtn"
                class="cancel"
                hidden
            >
                Cancel Edit
            </button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
        <h2>Student List</h2>

        <button type="button" id="refreshBtn" class="primary">
            Refresh Students
        </button>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Department</th>
                        <th>Roll</th>
                        <th>Session</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentTable">
                    <tr>
                        <td colspan="7">Loading students...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
